<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Infonixx is temporarily unavailable while maintenance is in progress.">
    <meta name="robots" content="noindex, nofollow">
    <title>Infonixx - Maintenance</title>

    <link rel="icon" type="image/x-icon" href="Site Logo.jfif">
    <link rel="shortcut icon" type="image/x-icon" href="Site Logo.jfif">
    <link rel="apple-touch-icon" href="Site Logo.jfif">

    <style>
        :root {
            color-scheme: light;
            --bg: #f4f7fb;
            --ink: #172033;
            --muted: #5d687a;
            --line: #dbe2ec;
            --brand: #2458d6;
            --accent: #0e9f8f;
            --surface: #ffffff;
            --shadow: 0 24px 70px rgba(23, 32, 51, 0.13);
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            min-height: 100%;
        }

        body {
            margin: 0;
            font-family: "Segoe UI", Arial, sans-serif;
            color: var(--ink);
            background:
                linear-gradient(135deg, rgba(36, 88, 214, 0.12), transparent 34%),
                linear-gradient(315deg, rgba(14, 159, 143, 0.12), transparent 32%),
                var(--bg);
            line-height: 1.5;
        }

        main {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
        }

        .panel {
            width: min(100%, 660px);
            padding: clamp(32px, 6vw, 56px);
            text-align: center;
            background: rgba(255, 255, 255, 0.96);
            border: 1px solid var(--line);
            border-radius: 8px;
            box-shadow: var(--shadow);
        }

        .logo {
            width: 72px;
            height: 72px;
            margin: 0 auto 28px;
            border-radius: 8px;
            object-fit: cover;
            border: 1px solid var(--line);
        }

        .status {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin: 0 0 18px;
            color: #124e49;
            font-size: 0.92rem;
            font-weight: 700;
        }

        .status::before {
            content: "";
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--accent);
            box-shadow: 0 0 0 6px rgba(14, 159, 143, 0.12);
        }

        h1 {
            margin: 0;
            font-size: clamp(2.1rem, 6vw, 4rem);
            line-height: 1.05;
            letter-spacing: 0;
        }

        p {
            margin: 20px auto 0;
            max-width: 500px;
            color: var(--muted);
            font-size: clamp(1rem, 2vw, 1.16rem);
        }

        .divider {
            width: 92px;
            height: 4px;
            margin: 32px auto 0;
            border-radius: 999px;
            background: linear-gradient(90deg, var(--brand), var(--accent));
        }

        @media (max-width: 520px) {
            main {
                padding: 16px;
            }

            .panel {
                padding: 30px 22px;
            }
        }
    </style>
</head>
<body>
    <main aria-labelledby="maintenance-title">
        <section class="panel">
            <img class="logo" src="Site Logo.jfif" alt="Infonixx logo">
            <p class="status">Scheduled maintenance</p>
            <h1 id="maintenance-title">We will be back soon.</h1>
            <p>Our website is temporarily offline while updates are in progress.</p>
            <div class="divider" aria-hidden="true"></div>
        </section>
    </main>
</body>
</html>
